name: Feature request
description: Propose a bounded capability or improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For security concerns, follow SECURITY.md and do not include exploit details in a public request.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user or consumer problem and when it occurs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
      description: Describe a result that maintainers can verify.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Technical context
      description: Identify relevant modules, current behavior, and constraints if known.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and non-goals
      description: What should this change include, and what should remain out of scope?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional approaches or workarounds.
    validations:
      required: false
